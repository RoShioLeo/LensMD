name: Release LensMD

on:
  push:
    tags: ["lensmd-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"
          package_json_file: console/package.json
      - name: Build and test
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#lensmd-v}"
      - name: Publish JAR with matching source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --verify-tag --generate-notes
