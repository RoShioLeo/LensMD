name: Release LensMD

on:
  push:
    tags: ["lensmd-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "LensMD release tag"
        required: true
        default: "lensmd-v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"
          package_json_file: console/package.json
      - name: Build and test
        run: ./gradlew build -Pversion="${RELEASE_TAG#lensmd-v}"
      - name: Publish JAR with matching source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/*.jar --clobber
          else
            gh release create "$RELEASE_TAG" build/libs/*.jar --verify-tag --title "LensMD ${RELEASE_TAG#lensmd-v}" --generate-notes
          fi
