apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: lensmd
spec:
  enabled: true
  requires: ">=2.26.0"
  author:
    name: RoShioLeo
    website: https://www.lemonslice.cloud
  logo: logo.svg
  homepage: https://github.com/RoShioLeo/LensMD
  repo: https://github.com/RoShioLeo/LensMD
  issues: https://github.com/RoShioLeo/LensMD/issues
  displayName: "LensMD"
  description: "基于 ByteMD 的 Halo Markdown 编辑器，支持提示框、高亮、上下标、Emoji 和目录"
  settingName: setting-lensmd
  configMapName: configmap-lensmd
  license:
    - name: "GPL-3.0"
      url: "https://github.com/RoShioLeo/LensMD/blob/main/LICENSE"
